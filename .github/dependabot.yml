# Monthly, grouped and capped, to keep update PRs (and CI minutes) low.
# The 7-day cooldown skips releases younger than a week.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      composer:
        patterns: ["*"]
